<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-Ledger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <h1>H-Ledger</h1>
    <button class="btn1">+Add Customer</button>
  </nav>
  
  <section class="zero">
    <p>Manage active customer debts</p>
    
    <div class="search_box">
    <input  class="search" type="search" placeholder="🔍 Search customer...">
    </div>
  </section>
  
  <main>
    <form class="seven">
      <p>Are you sure you want to remove this customer</p>
      <div class="btns">
        <button class="yes">Yes</button>
        <button class="no">No</button>
      </div>
    </form>
    
   <section class="one">
     <h2>Active Customers</h2>
     <div class="container1">
       
     </div>
   </section> 
    
    <form class="two">
      <p class="p1"></p>
      <input class="input1" type="text" placeholder="Enter Customer Name">
      <div class="btns">
      <button class="btn3">Create Customer</button>
      <button class="btn4">Cancel</button>
      </div>
    </form>
    
    <section class="three">
      <div class="btns">
      <button class="btn5">Back</button>
      <button class="btn6">Add New Debt</button>
      </div>
      
      <h3>Total outstanding for<span class="name"></span></h3>
      <div class="container3">
        <h3>Total Debt:</h3>
        <p class="outstanding">0</p>
      </div>
    
      <div class="container2">
        
      </div>
      <div class="container4">
        
      </div>
    </section>
    
    <section class="four">
      <button class="btn7">Back</button>
      <div class="item_name">
        
      </div>
      <div class="original_amount">
        
      </div>
      <div class="remaining_amount">
        
      </div>
      <div class="date">
        
      </div>
      <div class="notes">
        
      </div>
      <div class="status">
        
      </div>
      <h3>Payment History</h3>
      <div class="history">
        
      </div>
      <div class="btns">
      <button class="btn8">Record Payment</button>
      <button class="btn9">Edit Debt</button>
      <button class="btn10">Delete Debt</button>
      </div>
    </section>
    
    <form class="five">
      <h3>Add Debt form</h3>
      <p class="p2"></p>
      <p><input class="input2" type="text" placeholder="Enter item/ service name"></p>
      
      <p><input class="input3" type="number" placeholder="Enter Amount"></p>
      
      <p><input class="input4" type="date" placeholder="Enter Date"></p>
      
      <p><textarea class="textarea" placeholder="Enter Notes (optional)" ></textarea></p>
      
      
        <div class="debtFormBtns">
        <button class="btn11">Save Debt</button>
        <button class="btn12">Cancel</button>
        </div>
      
    </form>
    
    <form class="six">
      <h3>Record Payment form</h3>
      <p class="p3"></p>
      <p><input class="input5" type="amount" placeholder="Enter Payment"></p>
      
      <p><input class="input6" type="date" ></p>
      
      <div class="btns">
        <button class="btn13">Save</button>
        <button class="btn14">Cancel</button>
      </div>
    </form>
    
    <section class="section8">
      
    </section>
   
  </main>
  
  <script type="module" src="app.js"></script>
</body>
</html>
